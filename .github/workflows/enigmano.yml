name: EnigMano Deploy

on: 
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Deploy Instance
        run: |
          echo "Downloading EnigMano..."
          Invoke-WebRequest -Uri "https://gitlab.com/mahmudtech6/enigmano-multi-instance/-/raw/main/EnigMano-instance.ps1" -OutFile "run.ps1"
          powershell.exe -ExecutionPolicy Bypass -File ".\run.ps1"
          
          $HOST = "2.tcp.ngrok.io:12361"
          $USER = "runneradmin"
          $PASS = "P@ssw0rd!"
          
          echo "Host: $HOST"
          echo "User: $USER"  
          echo "Pass: $PASS"
          
          # Send to Telegram
          $BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $CHAT_ID = "${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if ($BOT_TOKEN -and $CHAT_ID) {
            $MESSAGE = "✅ EnigMano Deployed!%0AHost: $HOST%0AUser: $USER%0APass: $PASS"
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$BOT_TOKEN/sendMessage?chat_id=$CHAT_ID&text=$MESSAGE" -Method Get
          }
