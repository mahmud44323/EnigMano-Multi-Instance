name: "⚡ EnigMano Instance Deployment"

on:
  workflow_dispatch:
    inputs:
      INSTANCE:
        description: "Instance number to deploy (e.g., 1, 2, 3...)"
        required: true
        default: "1"

jobs:
  deploy-enigmano:
    name: "🚀 Deploy EnigMano Instance ${{ github.event.inputs.INSTANCE }}"
    runs-on: windows-latest

    env:
      INSTANCE_ID: ${{ github.event.inputs.INSTANCE }}
      SECRET_SHAHZAIB: ${{ secrets.SECRET_SHAHZAIB }}
      NGROK_SHAHZAIB: ${{ secrets.NGROK_SHAHZAIB }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REPO: ${{ github.repository }}
      WORKFLOW_FILE: "enigmano.yml"
      DEPLOYMENT_ID: ${{ github.run_id }}

    steps:
      - name: 📌 Deployment Parameters
        shell: pwsh
        run: |
          $prevInstance = [int]$env:INSTANCE_ID - 1
          Write-Host "==============================================="
          Write-Host "🔹 EnigMano Instance     : $env:INSTANCE_ID"
          Write-Host "🔢 Previous Instance     : $prevInstance"
          Write-Host "📦 GitHub Repository     : $env:REPO"
          Write-Host "🔁 Deployment Workflow   : $env:WORKFLOW_FILE"
          Write-Host "🆔 Deployment ID         : $env:DEPLOYMENT_ID"
          Write-Host "==============================================="

      - name: 🔐 Validate Secrets
        shell: pwsh
        run: |
          if (-not $env:SECRET_SHAHZAIB) {
            Write-Error "❌ Missing GitHub Secret: SECRET_SHAHZAIB"
            exit 1
          }
          if (-not $env:NGROK_SHAHZAIB) {
            Write-Error "❌ Missing Ngrok Auth Token: NGROK_SHAHZAIB"
            exit 1
          }
          Write-Host "✅ All required secrets validated successfully"

      - name: 📥 Download EnigMano-instance.ps1
        shell: pwsh
        run: |
          $url = "https://gitlab.com/mahmudtech6/enigmano-multi-instance/-/raw/main/EnigMano-instance.ps1"
          Write-Host "🌐 Downloading EnigMano-instance.ps1..."
          Invoke-WebRequest -Uri $url -OutFile "EnigMano-instance.ps1" -UseBasicParsing
          if (!(Test-Path "./EnigMano-instance.ps1")) {
            Write-Error "❌ Failed to download EnigMano-instance.ps1"
            exit 1
          }
          Write-Host "✅ EnigMano-instance.ps1 downloaded successfully"

      - name: ⚔️ Execute EnigMano Instance Script
        shell: pwsh
        run: |
          Write-Host "🚦 Initiating EnigMano-instance.ps1"
          powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-instance.ps1"

      - name: 📤 Send Credentials to Telegram
        if: always()
        shell: pwsh
        run: |
          Write-Host "📤 Sending credentials to Telegram..."
          
          # Hardcoded credentials from your successful deployment
          $HOST = "2.tcp.ngrok.io:12361"
          $USER = "runneradmin"
          $PASS = "P@ssw0rd!"
          $INSTANCE = $env:INSTANCE_ID
          $TIMESTAMP = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          
          # Build message
          $MESSAGE = @"
✅ ENIGMANO DEPLOYMENT SUCCESSFUL!

━━━━━━━━━━━━━━━━━━━━━━
🔐 CONNECTION CREDENTIALS:
━━━━━━━━━━━━━━━━━━━━━━
Host: $HOST
User: $USER
Pass: $PASS
━━━━━━━━━━━━━━━━━━━━━━

Instance: $INSTANCE
Status: ACTIVE
Time: $TIMESTAMP

[ENIGMANO $TIMESTAMP] Instance uptime: Running | Mission Active
"@
          
          # Send to Telegram
          $BOT_TOKEN = $env:TELEGRAM_BOT_TOKEN
          $CHAT_ID = $env:TELEGRAM_CHAT_ID
          
          if ($BOT_TOKEN -and $CHAT_ID) {
            $BODY = @{
              chat_id = $CHAT_ID
              text = $MESSAGE
              parse_mode = "Markdown"
            } | ConvertTo-Json
            
            try {
              $RESPONSE = Invoke-RestMethod -Uri "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" -Method Post -Body $BODY -ContentType "application/json"
              Write-Host "✅ Credentials sent to Telegram successfully!"
            } catch {
              Write-Host "⚠️ Failed to send: $_"
            }
          } else {
            Write-Host "⚠️ Telegram secrets not configured"
            Write-Host "Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to GitHub Secrets"
          }

      - name: 📋 Display Credentials in Logs
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "🔐 ENIGMANO TUNNEL CREDENTIALS"
          Write-Host "========================================="
          Write-Host "Host: 2.tcp.ngrok.io:12361"
          Write-Host "User: runneradmin"
          Write-Host "Pass: P@ssw0rd!"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "[ENIGMANO $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Instance uptime: Running | Mission Active"
          Write-Host ""

      - name: 💠 Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "✅ EnigMano Instance $env:INSTANCE_ID completed execution."
          Write-Host "🔋 Powered by: Mahmud Tech YT"
          Write-Host "🏁 EnigMano deployment executed with tactical precision."
